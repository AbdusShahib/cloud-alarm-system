<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Alarm Dashboard</title>
    <style>
        body { 
            margin: 0; 
            font-family: system-ui, sans-serif; 
            background-color: #12141d; 
            color: #ffffff;
            height: 100vh; 
            display: flex; 
            flex-direction: column;
            overflow: hidden; 
        }
        
        .header-bg { padding: 20px 30px; flex-shrink: 0; }
        .title-text { color: #6d809c; font-size: 15px; margin-bottom: 25px; font-weight: 600; }
        .controls-row { display: flex; align-items: center; gap: 20px; margin-bottom: 40px; }
        
        #conn-badge { 
            display: flex; align-items: center; background-color: #1a1a1a; 
            border: 1px solid #6d809c; color: #6d809c; padding: 6px 18px; 
            border-radius: 20px; font-size: 13px; font-weight: 600; 
        }
        #conn-badge.connected { color: #4CAF50; border-color: #4CAF50; }
        #conn-badge.error { color: #F44336; border-color: #F44336; }
        
        .spinner {
            display: inline-block; width: 14px; height: 14px;
            border: 2px solid rgba(255,255,255,0.3); border-radius: 50%;
            border-top-color: currentColor; animation: spin 1s linear infinite;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .btn-silence { 
            background-color: #e54d42; color: white; border: none; 
            padding: 8px 24px; border-radius: 6px; font-weight: 600; 
            cursor: pointer; transition: 0.2s;
        }
        .btn-silence:hover { background-color: #ff574a; }
        
        .event-log-container { border-bottom: 1px solid #2a2e3d; padding-bottom: 8px; }
        .event-log-container span { color: #ffffff; font-weight: 700; font-size: 16px; }

        .table-area {
            flex-grow: 1; display: flex; align-items: flex-end; 
            justify-content: center; padding: 40px 30px;
        }
        
        .tables-wrapper { display: flex; width: 100%; gap: 30px; }
        .green-border-outer { flex: 1; border: 2px solid #578a51; padding: 3px; background-color: #12141d; }
        .green-border-inner { border: 1px solid #578a51; background-color: #1e212b; height: 100%; }
        
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th, td { border: 1px solid #2a2e3d; padding: 12px 15px; text-align: left; font-size: 14px; color: #ffffff; height: 22px; }
        
        th { font-weight: 800; background-color: #252936; color: #a1b0c8; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .status-green { background-color: #578a51; color: white; font-weight: 600; }
        .status-orange { background-color: #d17a43; color: white; font-weight: 600; }
        
        /* Red and Yellow Flashing Sequence for Alarms */
        .status-alarm { 
            font-weight: 700; color: #000; 
            animation: redYellowFlash 0.8s infinite alternate; 
        }
        @keyframes redYellowFlash { 
            0% { background-color: #e54d42; color: #fff; } 
            100% { background-color: #f1c40f; color: #000; } 
        }
    </style>
</head>
<body onclick="initAudioContext()"> <!-- Unlocks browser audio policy on first click -->

<div class="header-bg">
    <div class="title-text">Live status of all room alarm nodes</div>
    <div class="controls-row">
        <div id="conn-badge">
            <span class="spinner" id="conn-spinner"></span> 
            <span id="conn-text">Connecting...</span>
        </div>
        <button class="btn-silence" onclick="silenceAlarms()">Silence All Alarms</button>
    </div>
    <div class="event-log-container">
        <span>Event Log</span>
    </div>
</div>

<div class="table-area">
    <div class="tables-wrapper">
        <div class="green-border-outer">
            <div class="green-border-inner">
                <table id="table-left">
                    <colgroup>
                        <col style="width: 56%;"><col style="width: 22%;"><col style="width: 22%;">
                    </colgroup>
                    <thead><tr><th>Position</th><th>Remote Status</th><th>Alarm Status</th></tr></thead>
                    <tbody id="tbody-left"></tbody>
                </table>
            </div>
        </div>

        <div class="green-border-outer">
            <div class="green-border-inner">
                <table id="table-right">
                    <colgroup>
                        <col style="width: 56%;"><col style="width: 22%;"><col style="width: 22%;">
                    </colgroup>
                    <thead><tr><th>Position</th><th>Remote Status</th><th>Alarm Status</th></tr></thead>
                    <tbody id="tbody-right"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const badge = document.getElementById('conn-badge');
    const badgeText = document.getElementById('conn-text');
    const spinner = document.getElementById('conn-spinner');
    
    let isConnected = false;
    let evtSource = null;
    let connectionTimeout = null;
    let audioCtx = null;
    let alarmInterval = null;

    // Browser audio context unlock
    function initAudioContext() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    // Play a pulsing alarm siren through the device speaker
    function playAlarmBeep() {
        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2);
        
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
    }

    function triggerSiren(shouldRing) {
        if (shouldRing && !alarmInterval) {
            alarmInterval = setInterval(playAlarmBeep, 500);
        } else if (!shouldRing && alarmInterval) {
            clearInterval(alarmInterval);
            alarmInterval = null;
        }
    }

    function connectToServer() {
        if (evtSource) evtSource.close();

        evtSource = new EventSource('/api/stream');

        evtSource.onopen = () => {
            isConnected = true;
            clearTimeout(connectionTimeout);
            spinner.style.display = 'none';
            badgeText.textContent = 'Connected';
            badge.className = 'connected';
        };

        evtSource.onerror = () => {
            isConnected = false;
            spinner.style.display = 'inline-block';
            badgeText.textContent = 'Reconnecting...';
            badge.className = '';
            
            clearTimeout(connectionTimeout);
            connectionTimeout = setTimeout(() => {
                if (!isConnected) {
                    spinner.style.display = 'none';
                    badge.className = 'error';
                    if (!navigator.onLine) {
                        badgeText.textContent = 'No Internet';
                    } else {
                        badgeText.textContent = 'Server Problem';
                    }
                }
            }, 10000);
        };

        evtSource.onmessage = (event) => {
            const data = JSON.parse(event.data);
            renderData(data);
        };
    }

    window.addEventListener('offline', () => {
        isConnected = false;
        clearTimeout(connectionTimeout);
        spinner.style.display = 'none';
        badge.className = 'error';
        badgeText.textContent = 'No Internet';
    });

    window.addEventListener('online', () => {
        spinner.style.display = 'inline-block';
        badge.className = '';
        badgeText.textContent = 'Connecting...';
        connectToServer();
    });

    function renderData(data) {
        const entries = Object.entries(data);
        let anyAlarmActive = false;

        entries.forEach(([name, info]) => {
            if (info.alarmTriggered) anyAlarmActive = true;
        });

        // Trigger or silence the device speaker siren
        triggerSiren(anyAlarmActive);

        const leftSideData = entries.slice(0, 8);
        const rightSideData = entries.slice(8, 16);
        
        const leftSide = fillRows(leftSideData, 8);
        const rightSide = fillRows(rightSideData, 8);

        document.getElementById('tbody-left').innerHTML = buildHTML(leftSide);
        document.getElementById('tbody-right').innerHTML = buildHTML(rightSide);
    }

    function fillRows(arr, length) {
        const copy = [...arr];
        while(copy.length < length) copy.push(null);
        return copy;
    }

    function buildHTML(rows) {
        let html = '';
        rows.forEach(row => {
            if (!row) {
                html += `<tr><td></td><td></td><td></td></tr>`;
            } else {
                const [name, info] = row;
                const isOnline = (info.status === 'online');
                const remoteClass = isOnline ? 'status-green' : 'status-orange';
                const remoteText = isOnline ? 'Online' : 'Offline';
                
                let alarmClass = remoteClass;
                let alarmText = isOnline ? 'Online' : 'Offline';
                
                // Active Alarm Styling Change
                if (info.alarmTriggered) {
                    alarmClass = 'status-alarm';
                    alarmText = 'ALARM ON';
                }

                html += `<tr>
                    <td>${name}</td>
                    <td class="${remoteClass}">${remoteText}</td>
                    <td class="${alarmClass}">${alarmText}</td>
                </tr>`;
            }
        });
        return html;
    }

    function silenceAlarms() {
        triggerSiren(false);
        fetch('/api/reset-all', { method: 'POST' });
    }

    renderData({});
    connectToServer();
</script>
</body>
</html>
